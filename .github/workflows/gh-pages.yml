# Builds marketing + docs into _site, publishes to the gh-pages branch (raw firmware URLs),
# and deploys the live site via GitHub Actions Pages (avoids the legacy Jekyll builder).
# App/OTA manifest: raw from main …/main/firmware/version.json
# Firmware bin: raw from gh-pages …/gh-pages/firmware/esp32_chess_v24.bin
# Live site: https://alfredkrutina.github.io/chess_esp32_c6_devkit/downloads.html

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
    - 'main/**'
    - 'components/**'
    - 'CMakeLists.txt'
    - 'README.md'
    - 'Doxyfile'
    - 'generate_docs.sh'
    - 'generate_mermaid_html.py'
    - 'scripts/docs/**'
    - 'docs/diagrams/**'
    - 'docs/reference/**'
    - 'docs/README.md'
    - 'docs/flutter/**'
    - 'scripts/render_docs.sh'
    - 'scripts/mermaid-puppeteer-ci.json'
    - 'gh-pages-ready/**'
    - 'firmware/**'
    - 'partitions.csv'
    - 'sdkconfig'
    - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Doxygen, Graphviz, Mermaid CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          npm install -g @mermaid-js/mermaid-cli

      - name: Build Doxygen HTML + Mermaid výstupy
        id: docs
        continue-on-error: true
        run: |
          sed -i 's/\r$//' scripts/docs/generate_docs.sh scripts/render_docs.sh generate_docs.sh || true
          chmod +x scripts/docs/generate_docs.sh scripts/render_docs.sh generate_docs.sh
          ./scripts/docs/generate_docs.sh
          ./scripts/render_docs.sh

      - name: Build ESP-IDF firmware (OTA .bin na gh-pages)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v5.5.1 \
            bash -c "idf.py set-target esp32c6 && idf.py build"

      - name: Složit adresář pro GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f docs/doxygen/html/index.html ]; then
            cp -a docs/doxygen/html/. _site/
          else
            echo "::warning::Doxygen HTML chybí — nasazuji marketing root s přesměrováním na downloads.html"
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en"><head>' \
              '<meta charset="utf-8">' \
              '<meta http-equiv="refresh" content="0; url=downloads.html">' \
              '<title>CzechMate</title>' \
              '<link rel="canonical" href="downloads.html">' \
              '</head><body>' \
              '<p><a href="downloads.html">CzechMate product page</a></p>' \
              '</body></html>' > _site/index.html
          fi
          if [ -f docs/diagrams/diagrams_mermaid.html ]; then
            cp -f docs/diagrams/diagrams_mermaid.html _site/diagrams_mermaid.html
          fi
          cp -f gh-pages-ready/downloads.html _site/downloads.html
          cp -f gh-pages-ready/app_update.json _site/app_update.json
          cp -f gh-pages-ready/app_update.html _site/app_update.html
          mkdir -p _site/landing
          cp -a gh-pages-ready/landing/. _site/landing/
          cp -f gh-pages-ready/.nojekyll _site/.nojekyll
          mkdir -p _site/firmware
          cp -f firmware/version.json _site/firmware/version.json
          if [ -f build/esp32_chess_v24.bin ]; then
            cp -f build/esp32_chess_v24.bin _site/firmware/esp32_chess_v24.bin
          else
            echo "::warning::Firmware bin chybí – zkontroluj ESP-IDF Docker build výše; OTA odkaz na .bin na Pages vrátí 404."
          fi

      - name: Kontrola _site před deployem
        run: |
          test -f _site/firmware/version.json || (echo "::error::Chybí _site/firmware/version.json" && exit 1)
          test -f _site/downloads.html || (echo "::error::Chybí _site/downloads.html" && exit 1)
          test -f _site/app_update.json || (echo "::error::Chybí _site/app_update.json" && exit 1)
          test -f _site/app_update.html || (echo "::error::Chybí _site/app_update.html" && exit 1)
          test -f _site/landing/landing.css || (echo "::error::Chybí _site/landing/landing.css" && exit 1)
          ls -la _site/firmware/

      - name: Ověření manifestu (raw na main)
        run: |
          code=$(curl -fsSL -o /dev/null -w "%{http_code}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/firmware/version.json")
          test "$code" = "200"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Mirror na větev gh-pages (raw firmware URL)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
